name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ian-hetzner"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: pnpm
      - name: Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Preview eligibility
        run: node --test scripts/ci/preview-eligibility.test.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Chrome
        run: pnpm --filter @enrailar/web exec playwright-core install chromium
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Install Playwright
        run: |
          if [[ "${{ runner.environment }}" == "github-hosted" ]]; then
            pnpm --filter @enrailar/web exec playwright install chromium --with-deps
          else
            # The managed runner supplies OS libraries; CI has no sudo access.
            pnpm --filter @enrailar/web exec playwright install chromium
          fi
      - name: E2E mobile
        run: pnpm --filter @enrailar/web e2e
      - name: Build web
        run: pnpm --filter @enrailar/web build
      - name: Build news
        run: pnpm --filter @enrailar/news build
