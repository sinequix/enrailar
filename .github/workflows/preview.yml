name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: preview
    # Forks and Dependabot do not receive Actions secrets. Their validation stays
    # in CI; never grant credentials just to run a preview of untrusted code.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ian-hetzner"]') || 'ubuntu-latest' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
      CLICKUP_LIST_ID_WEB: ${{ vars.CLICKUP_LIST_ID_WEB }}
      CLICKUP_LIST_ID_CONTACTS: ${{ vars.CLICKUP_LIST_ID_CONTACTS }}
      ACCESS_ALLOWED_EMAILS: ${{ secrets.ACCESS_ALLOWED_EMAILS }}
      ACCESS_SERVICE_TOKEN_IDS: ${{ secrets.ACCESS_SERVICE_TOKEN_IDS }}
      POLICY_AUD: ${{ secrets.POLICY_AUD }}
      TEAM_DOMAIN: ${{ secrets.TEAM_DOMAIN }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      EMAIL_VERIFICATION_REQUIRED: ${{ secrets.EMAIL_VERIFICATION_REQUIRED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install inbox
        run: npm ci --prefix apps/inbox
      - name: Ephemeral auth secret
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::${secret}"
          echo "BETTER_AUTH_SECRET=${secret}" >> "$GITHUB_ENV"
          news="$(openssl rand -base64 32)"
          echo "::add-mask::${news}"
          echo "EMDASH_ENCRYPTION_KEY=${news}" >> "$GITHUB_ENV"
      - name: Fail closed
        run: bash scripts/ci/require-secrets.sh
      - name: Deploy pr stage
        id: deploy
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/scripts/ci/inbox-vite-hooks.mjs
        run: pnpm --filter @enrailar/infra exec alchemy deploy --yes --no-input --stage "pr-${{ github.event.pull_request.number }}"
      - name: EmDash migrations (news)
        id: migrate
        if: steps.deploy.outcome == 'success'
        run: bash scripts/ci/news-migrate.sh "pr-${{ github.event.pull_request.number }}"
      - name: Smoke news admin
        if: steps.deploy.outcome == 'success' && steps.migrate.outcome == 'success'
        run: bash scripts/ci/news-admin-smoke.sh "pr-${{ github.event.pull_request.number }}"
      - name: Destroy pr stage
        if: always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/scripts/ci/inbox-vite-hooks.mjs
        run: pnpm --filter @enrailar/infra exec alchemy destroy --yes --no-input --stage "pr-${{ github.event.pull_request.number }}"

  destroy:
    name: destroy preview
    # Only these PRs can have created a preview stage above.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ian-hetzner"]') || 'ubuntu-latest' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
      CLICKUP_LIST_ID_WEB: ${{ vars.CLICKUP_LIST_ID_WEB }}
      CLICKUP_LIST_ID_CONTACTS: ${{ vars.CLICKUP_LIST_ID_CONTACTS }}
      ACCESS_ALLOWED_EMAILS: ${{ secrets.ACCESS_ALLOWED_EMAILS }}
      ACCESS_SERVICE_TOKEN_IDS: ${{ secrets.ACCESS_SERVICE_TOKEN_IDS }}
      POLICY_AUD: ${{ secrets.POLICY_AUD }}
      TEAM_DOMAIN: ${{ secrets.TEAM_DOMAIN }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      EMAIL_VERIFICATION_REQUIRED: ${{ secrets.EMAIL_VERIFICATION_REQUIRED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Ephemeral auth secret
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::${secret}"
          echo "BETTER_AUTH_SECRET=${secret}" >> "$GITHUB_ENV"
          news="$(openssl rand -base64 32)"
          echo "::add-mask::${news}"
          echo "EMDASH_ENCRYPTION_KEY=${news}" >> "$GITHUB_ENV"
      - name: Fail closed
        run: bash scripts/ci/require-secrets.sh
      - name: Destroy pr stage
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/scripts/ci/inbox-vite-hooks.mjs
        run: pnpm --filter @enrailar/infra exec alchemy destroy --yes --no-input --stage "pr-${{ github.event.pull_request.number }}"
