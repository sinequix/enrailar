name: Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://enrailar.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      FORWARD_TO: ${{ secrets.FORWARD_TO }}
      ACCESS_ALLOWED_EMAILS: ${{ secrets.ACCESS_ALLOWED_EMAILS }}
      POLICY_AUD: ${{ secrets.POLICY_AUD }}
      TEAM_DOMAIN: ${{ secrets.TEAM_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install inbox
        run: npm ci --prefix apps/inbox
      - name: Fail closed
        run: bash scripts/ci/require-secrets.sh
      - name: Deploy prod
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/scripts/ci/inbox-vite-hooks.mjs
        run: pnpm --filter @enrailar/infra exec alchemy deploy --yes --no-input --stage prod
