name: Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: production
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","ian-hetzner"]') || 'ubuntu-latest' }}
    environment:
      name: production
      url: https://enrailar.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
      CLICKUP_LIST_ID_WEB: ${{ vars.CLICKUP_LIST_ID_WEB }}
      CLICKUP_LIST_ID_CONTACTS: ${{ vars.CLICKUP_LIST_ID_CONTACTS }}
      ACCESS_ALLOWED_EMAILS: ${{ secrets.ACCESS_ALLOWED_EMAILS }}
      ACCESS_SERVICE_TOKEN_IDS: ${{ secrets.ACCESS_SERVICE_TOKEN_IDS }}
      POLICY_AUD: ${{ secrets.POLICY_AUD }}
      TEAM_DOMAIN: ${{ secrets.TEAM_DOMAIN }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      EMAIL_VERIFICATION_REQUIRED: ${{ secrets.EMAIL_VERIFICATION_REQUIRED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install inbox
        run: npm ci --prefix apps/inbox
      # Las migraciones de EmDash son compatibles con el código anterior: van
      # antes del deploy, así el Worker nuevo (runtime "check") arranca migrado.
      - name: EmDash migrations (news)
        env:
          NEWS_D1_TARGET_FINGERPRINT: ${{ vars.NEWS_D1_TARGET_FINGERPRINT }}
        run: bash scripts/ci/news-migrate.sh prod "$NEWS_D1_TARGET_FINGERPRINT"
      - name: Deploy prod
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/scripts/ci/inbox-vite-hooks.mjs
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          EMDASH_ENCRYPTION_KEY: ${{ secrets.EMDASH_ENCRYPTION_KEY }}
        run: |
          bash scripts/ci/require-secrets.sh
          pnpm --filter @enrailar/infra exec alchemy deploy --yes --no-input --stage prod
      - name: Smoke news
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --write-out 'noticias.enrailar.com %{http_code}\n'
          --retry 5 --retry-delay 5 --retry-all-errors --max-time 20
          https://noticias.enrailar.com/
