<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>OG · Enrailar</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; }
  .bg { position: absolute; inset: 0; background: url("../../../apps/web/public/brand/img/hero-pampa-1280.jpg") center 60% / cover no-repeat; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,.96) 0%, rgba(255,255,255,.92) 46%, rgba(255,255,255,.35) 72%, rgba(255,255,255,0) 100%); }
  .box { position: absolute; left: 72px; top: 72px; right: 72px; bottom: 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { height: 56px; }
  h1 { font-size: 78px; max-width: 760px; }
  .lede { font-size: 26px; color: var(--balasto); margin: 22px 0 0; max-width: 640px; line-height: 1.35; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; font-family: var(--display); font-stretch: 112%; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--balasto); }
  .foot span { background: rgba(255,255,255,.88); padding: 8px 14px; border-radius: 999px; }
  .foot b { color: var(--celeste-700); }
</style></head>
<body>
  <div class="bg"></div><div class="scrim"></div>
  <div class="box">
    <img class="logo" src="../../../apps/web/public/brand/logo-horizontal.svg" alt="Enrailar">
    <div>
      <p class="eyebrow">Proyecto abierto · Fase 1: monitoreo</p>
      <h1 style="margin-top:18px">Una red que se pueda volver a usar</h1>
      <p class="lede">Recuperar los trenes de Argentina. Primero ver, después mover.</p>
    </div>
    <div class="foot"><span>enrailar.com</span><span>Hackatrain · <b>Febrero 2027</b></span></div>
  </div>
</body></html>
